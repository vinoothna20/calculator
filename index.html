<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="mainCont">
        <div id="displayCont">fdgh</div>
        <div id="btnsCont">
            <div class="row">
                <button>AC</button>
                <button>Del</button>
                <button value="/">/</button>
                <button value="+">+</button>
            </div>
            <div class="row">
                <button value="7">7</button>
                <button value="8">8</button>
                <button value="9">9</button>
                <button value="-">-</button>
            </div>
            <div class="row">
                <button value="4">4</button>
                <button value="5">5</button>
                <button value="6">6</button>
                <button value="*">*</button>
            </div>
            <div class="lastRowCont">
                <div>
                    <div class="row">
                        <button value="1">1</button>
                        <button value="2">2</button>
                        <button value="3">3</button>
                    </div>
                    <div class="lastRow">
                        <button value="0" class="zeroBtn">0</button>
                        <button value="." class="dotBtn">.</button>
                    </div>
                </div>
                <button value="=" class="equalsToBtn">=</button>

            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
